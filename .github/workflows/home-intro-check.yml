# 0.48.0 RC3 local check (not the release gate): the Home entry sequence played live on the same low-RAM emulator as
# lowram-smoke.yml, with animations ON (the gate disables them, so it only sees the reduce-motion path), same 700 ms
# main-stall limit; screen-recorded and screenshotted every 0.5 s for comparison with the approved video. The official
# gate (six LowRamSmokeTest scenarios) is untouched; this only runs HomeIntroCheck.
name: Home intro check

on:
  push:
    branches: [ "check/**" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-intro-check-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  intro:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
      - name: Build debug app + test APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain "-Dorg.gradle.jvmargs=-Xmx5g -Xss8m -XX:MaxMetaspaceSize=1g" \
            -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.jvm.target.validation.mode=warning 2>&1 | tee build-intro.log
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Low-RAM emulator (API 31, 1.5 GB RAM, 192 MB heap), animations on
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          ram-size: 1536M
          heap-size: 192M
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot
          disable-animations: false
          script: bash tools/smoke/run-intro.sh
      - name: Summary
        if: always()
        run: cat intro-out/SUMMARY.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intro-out
          retention-days: 7
          path: |
            intro-out/
            app/build/outputs/apk/debug/app-debug.apk
