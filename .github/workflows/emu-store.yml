# app/emu-store: INTERIM EMULATOR checks of the Blaze Store installer on Android 8 (API 26), 12 (API 31) and 14 (API 34).
# EMULATOR evidence only (x86_64 google_apis images in GitHub Actions); the real-phone checks stay open for the owner.
# Debug build only: no signing key, no secrets, no release, no publishing, no version bump.
name: Emu Store checks (EMULATOR)

on:
  push:
    branches: [ "app/emu-store" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emu-store-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
      - name: Fixture APKs (throwaway test keys, made here)
        run: bash tools/emu/make_fixtures.sh
      - name: Debug APK + androidTest APK (x86_64)
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -Pblaze.abis=x86_64 --console=plain --stacktrace \
            "-Dorg.gradle.jvmargs=-Xmx5g -Xss8m -XX:MaxMetaspaceSize=1g" -Pkotlin.compiler.execution.strategy=in-process \
            -Pkotlin.jvm.target.validation.mode=warning 2>&1 | tee build.log
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk apk/
          cp app/src/androidTest/assets/emu/fixtures.json apk/
          (cd apk && sha256sum *.apk | tee SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emu-store-apks
          retention-days: 3
          path: |
            apk/
            build.log

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 31, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: emu-store-apks, path: apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator run (API ${{ matrix.api-level }}, x86_64 google_apis)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash tools/emu/run_emu.sh ${{ matrix.api-level }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emu-store-api${{ matrix.api-level }}
          retention-days: 7
          path: out/
