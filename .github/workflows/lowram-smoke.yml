# 0.46.6 low-RAM release gate (Rocky, "STABILITY FIRST"): a release is only published when this passes.
# Source copy; it runs on the public build mirror (GitHub) when a smoke/** branch is pushed (point it at the candidate commit).
# It builds the release APK of that commit exactly like Mobile build (R8 is deterministic: same dex as the published APK, the job
# prints the dex hashes to compare) plus the debug app and the instrumented smoke test. No key, keystore or password is ever used
# here: the release APK is signed with a throwaway key generated in the job, only so the emulator can install it.
name: Low-RAM smoke gate

on:
  push:
    branches: [ "smoke/**" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lowram-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-go@v5
        with: { go-version: "1.26.x", cache: false }
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
      - name: Test media (generated)
        run: bash tools/smoke/make-media.sh
      - name: Go libraries (as in Mobile build)
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          (cd wgproxy && CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../app/src/main/jniLibs/arm64-v8a/libwgproxy.so . \
            && CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags "-s -w" -o ../app/src/main/jniLibs/armeabi-v7a/libwgproxy.so .) || echo "wgproxy build skipped"
          (cd blazerouter && CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=$VER" -o ../app/src/main/jniLibs/arm64-v8a/libblazerouter.so . \
            && CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags "-s -w -X main.version=$VER" -o ../app/src/main/jniLibs/armeabi-v7a/libblazerouter.so .) || echo "blazerouter build skipped"
      - name: Build release APK + debug app + smoke test APK (same commit)
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest --console=plain "-Dorg.gradle.jvmargs=-Xmx5g -Xss8m -XX:MaxMetaspaceSize=1g" \
            -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.jvm.target.validation.mode=warning 2>&1 | tee build-smoke.log
          ls -la app/build/outputs/apk/release app/build/outputs/apk/debug app/build/outputs/apk/androidTest/debug
      - name: Sign the candidate with a throwaway key (install only)
        run: |
          mkdir -p rel; BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/*-unsigned.apk rel/candidate-aligned.apk
          APK=rel/candidate-aligned.apk
          for d in $(unzip -Z1 "$APK" | grep -E '^classes[0-9]*\.dex$'); do echo "$d $(unzip -p "$APK" "$d" | sha256sum | cut -c1-64)"; done | tee rel/DEX-SHA256 | tee -a "$GITHUB_STEP_SUMMARY"
          keytool -genkeypair -keystore ci-smoke.p12 -storetype PKCS12 -storepass smokeonly -keypass smokeonly -alias smoke -keyalg RSA -keysize 2048 -validity 2 -dname "CN=Blaze smoke"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign --ks ci-smoke.p12 --ks-pass pass:smokeonly --out rel/smoke-signed.apk "$APK"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Low-RAM emulator (API 31, 1.5 GB RAM, 192 MB heap)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          ram-size: 1536M
          heap-size: 192M
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot
          disable-animations: true
          script: bash tools/smoke/run-smoke.sh rel/smoke-signed.apk app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Summary
        if: always()
        run: cat smoke-out/SUMMARY.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-out
          retention-days: 7
          path: |
            smoke-out/
            build-smoke.log
            rel/DEX-SHA256
