# RC2 local check (not the release gate): card focus open / close on the same low-RAM emulator as lowram-smoke.yml, with
# animations ON (the gate disables them), same 700 ms main-stall limit. The official gate (six LowRamSmokeTest scenarios)
# is untouched; this only runs HomeFocusCheck.
name: Home focus check

on:
  push:
    branches: [ "check/**" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-focus-check-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  focus:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
      - name: Build debug app + test APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain "-Dorg.gradle.jvmargs=-Xmx5g -Xss8m -XX:MaxMetaspaceSize=1g" \
            -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.jvm.target.validation.mode=warning 2>&1 | tee build-focus.log
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Low-RAM emulator (API 31, 1.5 GB RAM, 192 MB heap), animations on
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          ram-size: 1536M
          heap-size: 192M
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot
          disable-animations: false
          script: |
            mkdir -p focus-out
            adb install -r -g app/build/outputs/apk/debug/app-debug.apk > focus-out/install.txt 2>&1
            adb install -r -g app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk >> focus-out/install.txt 2>&1
            adb logcat -c
            timeout 1200 adb shell am instrument -w -r -e class com.blaze.assistant.smoke.HomeFocusCheck com.blaze.assistant.test/androidx.test.runner.AndroidJUnitRunner > focus-out/instrument.txt 2>&1 || true
            adb logcat -d -v threadtime > focus-out/logcat.txt
            grep -E "OK \(|FAILURES|Tests run|shortMsg|stack=" focus-out/instrument.txt | head -20 | tee focus-out/SUMMARY.md
            grep "BlazeFocusCheck" focus-out/logcat.txt | sed 's/^.*BlazeFocusCheck: /  /' | tee -a focus-out/SUMMARY.md
            grep -q "^OK (1 test)" focus-out/instrument.txt
      - name: Summary
        if: always()
        run: cat focus-out/SUMMARY.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focus-out
          retention-days: 7
          path: focus-out/
